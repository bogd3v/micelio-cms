name: Scorecard

on:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: ['main']
  workflow_dispatch:

# Nothing by default; the job asks for exactly what Scorecard needs.
permissions: {}

jobs:
  scorecard:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
