name: CodeQL

# Static analysis for vulnerabilities, apart from CI so it never slows the
# required checks. Results appear in code scanning.
on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

# Nothing by default; the job asks for exactly what CodeQL needs.
permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
