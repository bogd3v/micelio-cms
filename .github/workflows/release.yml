name: Release

# Only the maintainer runs it (ADR 0010). It defaults to a dry run: it prints the version and the
# notes it would publish and changes nothing. Publishing is a second job in the `release`
# environment, which waits for the maintainer's approval; only that job asks for packages: write.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the version and the notes without tagging or publishing
        type: boolean
        default: true
      release_candidate:
        description: Release a candidate (vX.Y.Z-rc.N) that moves neither X.Y nor latest
        type: boolean
        default: false
      frontend_line:
        description: "micelio release line it was tested with, e.g. 0.1 (required to publish)"
        type: string
        default: ''
      upgrade_notes:
        description: Upgrade notes for the release body (required when a pull request is breaking)
        type: string
        default: ''

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # contents: write only because the endpoint that generates release notes asks for it; nothing
    # is written. packages: read lets the checks inspect the images.
    permissions:
      contents: write
      packages: read
      actions: read
      pull-requests: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Compute the next version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ inputs.release_candidate }}
        run: |
          if [ "$RC" = true ]; then
            node scripts/release/version.mjs --rc > plan.json
          else
            node scripts/release/version.mjs > plan.json
          fi
          cat plan.json
          {
            echo "tag=$(jq -r .tag plan.json)"
            echo "version=$(jq -r .version plan.json)"
            echo "previous=$(jq -r '.previous // empty' plan.json)"
            echo "bump=$(jq -r '.bump // empty' plan.json)"
            echo "prerelease=$(jq -r .prerelease plan.json)"
            echo "breaking=$(jq -r .breaking plan.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Generate the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          FRONTEND_LINE: ${{ inputs.frontend_line }}
          UPGRADE_NOTES: ${{ inputs.upgrade_notes }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node_range=$(node -p "require('./package.json').engines.node")
          args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f configuration_file_path=.github/release.yml)
          if [ -n "$PREVIOUS" ]; then args+=(-f previous_tag_name="$PREVIOUS"); fi
          gh api -X POST "repos/$REPO/releases/generate-notes" "${args[@]}" -q .body > generated.md
          {
            echo "## Upgrade notes"
            echo
            echo "${UPGRADE_NOTES:-No manual steps.}"
            echo
            echo "## Compatibility"
            echo
            echo "- Tested with micelio release line: ${FRONTEND_LINE:-_not stated_}"
            echo "- Node: $node_range"
            echo "- PostgreSQL: 18 or newer"
            echo
            cat generated.md
          } > release-notes.md
          cat release-notes.md
          {
            echo "### Release \`$TAG\` ($([ "$DRY_RUN" = true ] && echo 'dry run' || echo 'publishing'))"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nothing is changed until every check passes. In a dry run a failed check is a warning.
      - name: Check the release can be published
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          BREAKING: ${{ steps.plan.outputs.breaking }}
          FRONTEND_LINE: ${{ inputs.frontend_line }}
          UPGRADE_NOTES: ${{ inputs.upgrade_notes }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          failed=0
          fail() {
            failed=1
            if [ "$DRY_RUN" = true ]; then echo "::warning::$1"; else echo "::error::$1"; fi
          }
          # package.json holds the version being released; a candidate carries the version it precedes
          expected="${VERSION%%-rc.*}"
          [[ "$FRONTEND_LINE" =~ ^[0-9]+\.[0-9]+$ && "$FRONTEND_LINE" = "${expected%.*}" ]] \
            || fail "frontend_line must be the MAJOR.MINOR of this release (${expected%.*}), the line micelio was tested with."
          if [ "$BREAKING" != 0 ] && [ -z "$UPGRADE_NOTES" ]; then
            fail "$BREAKING breaking pull request(s) since the last release: set upgrade_notes."
          fi
          actual=$(node -p "require('./package.json').version")
          [ "$actual" = "$expected" ] || fail "package.json says $actual but this release is $expected. Merge a chore(release) pull request that sets it."
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then fail "The tag $TAG already exists. A published version never changes."; fi
          # The image job decides, not the whole run: the last job calls the maintainers' own deployment hook
          run_id=$(gh run list --repo "$REPO" --workflow deploy.yml --branch main --commit "$GITHUB_SHA" --json databaseId,conclusion -q '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].databaseId // empty')
          built=0
          if [ -n "$run_id" ]; then
            built=$(gh run view "$run_id" --repo "$REPO" --json jobs -q '[.jobs[] | select(.name == "build-and-push" and .conclusion == "success")] | length')
          fi
          [ "$built" -ge 1 ] || fail "Build and Deploy has not built the image on $GITHUB_SHA."
          short="${GITHUB_SHA::7}"
          for image in "$IMAGE"; do
            if ! docker buildx imagetools inspect "$image:$short" >/dev/null 2>&1; then
              fail "$image:$short does not exist. Wait for the pipeline of this commit, or run Build and Deploy by hand on main (a merge that touches only docs publishes no image)."
            elif docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
              # Left by an earlier run that stopped before the release: fine only if it is this commit's image
              [ "$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest.Digest}}')" = "$(docker buildx imagetools inspect "$image:$short" --format '{{json .Manifest.Digest}}')" ] \
                || fail "$image:$VERSION already exists and is not this commit's image. A published version never changes."
            fi
          done
          if [ "$failed" = 1 ] && [ "$DRY_RUN" != true ]; then exit 1; fi

      - name: Keep the notes for the publish job
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Publish
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # The maintainer approves here (Settings, Environments, release).
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download the notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A manifest copy of the image already built and tested for this commit: nothing is rebuilt
      - name: Tag the images
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          short="${GITHUB_SHA::7}"
          tags=("$VERSION")
          if [ "$PRERELEASE" != true ]; then
            tags+=("${VERSION%.*}" latest)
          fi
          for image in "$IMAGE"; do
            args=()
            for tag in "${tags[@]}"; do args+=(--tag "$image:$tag"); done
            docker buildx imagetools create "${args[@]}" "$image:$short"
          done

      - name: Tag main and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md "${flags[@]}"
          echo "Released $TAG at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
