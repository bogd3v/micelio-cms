# The frontend's contract suite against a CMS built from this pull request. The suite lives in bogd3v/micelio
# (e2e/contract/, `npm run test:contract`); it starts the image given in CONTRACT_CMS_IMAGE with Postgres and the demo content
# (MICELIO_DEMO). Docs: docs/architecture/ci-pipeline.md.
#
# It runs on every pull request to main or develop, with no `paths` filter, so it can be a required check of `main`: a required check
# from a workflow that a path filter skips never reports and blocks the pull request. It does not gate `deploy`.
#
# The frontend's own workflow cannot be called from here: a called workflow checks out the caller's repository, so the frontend's
# source is checked out below instead.
name: Contract tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Branch, tag or commit of bogd3v/micelio to test against, instead of the latest release and the previous MINOR
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  CMS_IMAGE: micelio-cms:contract

jobs:
  # The frontend refs under test: the latest release and the previous MINOR (standard, section 7), or the `frontend_ref` input alone.
  refs:
    name: Frontend refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.refs.outputs.matrix }}
    steps:
      - name: Checkout the CMS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Choose the frontend refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.frontend_ref }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            matrix=$(jq -cn --arg ref "$OVERRIDE" '{include: [{label: "override", ref: $ref}]}')
          else
            matrix=$(gh api --paginate repos/bogd3v/micelio/git/matching-refs/tags/v -q '.[].ref | ltrimstr("refs/tags/")' | node scripts/release/frontend-refs.mjs)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  contract:
    name: Contract Tests (${{ matrix.label }})
    needs: refs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.refs.outputs.matrix) }}
    # packages: write is for the Postgres copy in GHCR; a fork's token is read-only and the script falls back to Docker Hub.
    permissions:
      contents: read
      packages: write

    steps:
      # Side by side with the frontend, never around it: Vite resolves a tsconfig by walking up from
      # each source file, and the CMS's tsconfig.json extends @micelio/tsconfig, which this job does
      # not install.
      - name: Checkout the CMS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: cms
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Loaded into the runner's Docker, never pushed: the suite uses a local image as it is.
      - name: Build the CMS image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: cms
          target: production
          load: true
          push: false
          tags: ${{ env.CMS_IMAGE }}
          cache-from: type=gha

      # Outside the Docker context (`cms`), so Strapi's TypeScript build never sees the frontend's sources.
      - name: Checkout the frontend
        id: frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bogd3v/micelio
          ref: ${{ matrix.ref }}
          path: frontend
          persist-credentials: false

      - name: Print the frontend under test
        working-directory: frontend
        env:
          FRONTEND_REF: ${{ matrix.ref }}
          LABEL: ${{ matrix.label }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "Frontend bogd3v/micelio ${FRONTEND_REF} (${LABEL}) at ${sha}"
          echo "Contract suite: frontend \`${FRONTEND_REF}\` (${LABEL}) at \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the Postgres image
        id: postgres
        working-directory: frontend
        env:
          OWNER: ${{ github.repository_owner }}
          SOURCE_URL: ${{ github.server_url }}/bogd3v/micelio
        run: echo "image=$(MIRROR_OWNER="${OWNER,,}" MIRROR_REGISTRY=ghcr.io SOURCE_URL="${SOURCE_URL}" scripts/ci/mirror-image.sh postgres:18-alpine)" >> "$GITHUB_OUTPUT"

      - name: Run the contract suite
        working-directory: frontend
        env:
          POSTGRES_IMAGE: ${{ steps.postgres.outputs.image }}
        run: CONTRACT_CMS_IMAGE="${CMS_IMAGE}" CONTRACT_POSTGRES_IMAGE="${POSTGRES_IMAGE}" npm run test:contract
