name: CI

# Pull requests run it here; pushes to main and develop run it from deploy.yml,
# which deploys only if it passes. The checks are the reusable workflow of
# micelio-engineering (docs/workflows.md there), pinned by commit SHA.
on:
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  # The required check of the ruleset "Protect main" and the one deploy.yml waits for is
  # `check / Check`: it passes only when audit, typecheck, lint, format, tests, licences, the
  # copy of the standard, REUSE and the build did.
  check:
    permissions:
      contents: read
    uses: bogd3v/micelio-engineering/.github/workflows/check.yml@2d3087d5ee4f3f6cb078ed69a7d91e128e2d289f # main
    with:
      licenses: true
      standard: true
      reuse: true
